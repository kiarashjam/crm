# Deploy backend (.NET Web API) to Azure Web App.
#
# Called by deploy.yml on every push to main (and on release / manual run), after the
# checks in ci.yml have passed and before the frontend is deployed. It has no trigger
# of its own, so it cannot deploy anything that has not been checked: to deploy by
# hand, run "Build and deploy to Azure Static Web Apps", which checks, then deploys
# this, then the frontend.
name: Build and deploy backend to Azure Web App

on:
  workflow_call:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_PACKAGE_PATH: './publish-api'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore ACI.sln

      - name: Build
        working-directory: backend
        run: dotnet build ACI.sln --configuration Release --no-restore

      - name: Publish
        working-directory: backend
        run: dotnet publish src/ACI.WebApi/ACI.WebApi.csproj -c Release -o ${{ github.workspace }}/publish-api --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Applies the email (SendGrid) configuration so password reset, team
      # invitations and task reminders can send. No-ops until the SENDGRID_API_KEY
      # secret exists, so the deploy is unaffected before then.
      #
      # The "is the secret set?" test is done inside the script, NOT in an `if:`
      # condition: the secrets context is not available to step-level `if`, and
      # referencing it there makes the whole workflow file invalid (every job is
      # skipped, so the deploy fails before it starts).
      #
      # `appsettings set` MERGES: it updates only the keys named below and leaves
      # everything else (notably the database connection string) untouched.
      # The API key lives in GitHub Secrets and is never written to the repository.
      - name: Configure email settings (SendGrid)
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # Origin of the deployed SPA — used to build the links inside the emails.
          # Override by adding a repository variable named SPA_BASE_URL.
          SPA_ORIGIN: ${{ vars.SPA_BASE_URL || 'https://mango-moss-0804bb403.1.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          if [ -z "${SENDGRID_API_KEY:-}" ]; then
            echo "SENDGRID_API_KEY secret is not set; leaving email settings unchanged."
            exit 0
          fi
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Could not find a Web App named '$APP_NAME' in this subscription; cannot apply email settings."
            exit 1
          fi
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Email__SmtpPassword=$SENDGRID_API_KEY" "Email__FrontendBaseUrl=$SPA_ORIGIN" \
            --output none
          echo "Applied Email__SmtpPassword and Email__FrontendBaseUrl=$SPA_ORIGIN to $APP_NAME ($RESOURCE_GROUP)."

      # Names the platform admins (Platform__AdminEmails): the people who run CadenceE
      # itself, who may read the site analytics of cadencee.ai and get its daily email.
      # A comma-separated list of addresses kept in the PLATFORM_ADMIN_EMAILS secret,
      # never in the repository, which is public. No-ops until that secret exists, so
      # the deploy is unaffected before then, and a list set by hand in Azure is kept.
      #
      # The "is the secret set?" test is done inside the script, NOT in an `if:`
      # condition: the secrets context is not available to step-level `if`, and
      # referencing it there makes the whole workflow file invalid (every job is
      # skipped, so the deploy fails before it starts).
      #
      # `appsettings set` MERGES: it updates only the key named below and leaves
      # everything else (notably the database connection string) untouched. The
      # addresses are not printed; only how many there are.
      - name: Configure platform admins
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_ADMIN_EMAILS:-}" ]; then
            echo "PLATFORM_ADMIN_EMAILS secret is not set; leaving the platform admins unchanged."
            exit 0
          fi
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Could not find a Web App named '$APP_NAME' in this subscription; cannot apply the platform admins."
            exit 1
          fi
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Platform__AdminEmails=$PLATFORM_ADMIN_EMAILS" \
            --output none
          COUNT=$(printf '%s' "$PLATFORM_ADMIN_EMAILS" | tr ',;' '\n\n' | grep -c '@' || true)
          echo "Applied Platform__AdminEmails ($COUNT address(es)) to $APP_NAME ($RESOURCE_GROUP)."

      # The API's own public address (Email__ApiBaseUrl) builds the links to email images
      # and the address a member portal reports a welcome's progress to, which must be
      # https: Pavillon 46 refuses a handoff that names any other. It defaults to
      # localhost, so it is set here from the address the frontend is built to call
      # (VITE_API_URL), or API_BASE_URL when that is set. Only when the Web App has no
      # public address yet: one set by hand in Azure is kept.
      - name: Configure the API's public address
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          API_ORIGIN: ${{ vars.API_BASE_URL || vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          API_ORIGIN="${API_ORIGIN%/}"
          case "$API_ORIGIN" in
            https://*) ;;
            *) echo "Neither API_BASE_URL nor VITE_API_URL is an https address; leaving Email__ApiBaseUrl unchanged."; exit 0 ;;
          esac
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::warning::Could not find a Web App named '$APP_NAME'; leaving Email__ApiBaseUrl unchanged."
            exit 0
          fi
          CURRENT=$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='Email__ApiBaseUrl'].value | [0]" -o tsv)
          case "$CURRENT" in
            https://*localhost*|http://*|"") ;;
            https://*) echo "Email__ApiBaseUrl is already $CURRENT; keeping it."; exit 0 ;;
          esac
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Email__ApiBaseUrl=$API_ORIGIN" \
            --output none
          echo "Set Email__ApiBaseUrl=$API_ORIGIN on $APP_NAME (it was '${CURRENT:-not set}')."

      # App Service's health check pings /health every minute: with more than one
      # instance it takes an unhealthy one out of rotation, and it replaces an instance
      # that stays unhealthy. Set only when it is not /health already, as a change to
      # the site config restarts the app. A failure here warns rather than stopping the
      # deploy. (infra/monitoring/deploy.sh sets the same, and does it for Pavillon 46.)
      - name: Configure the health check path
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::warning::Could not find a Web App named '$APP_NAME'; leaving the health check path unchanged."
            exit 0
          fi
          CURRENT=$(az webapp config show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query healthCheckPath -o tsv)
          if [ "$CURRENT" = "None" ]; then CURRENT=""; fi
          if [ "$CURRENT" = "/health" ]; then
            echo "The health check path is already /health."
            exit 0
          fi
          if az webapp config set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
               --generic-configurations '{"healthCheckPath": "/health"}' --output none; then
            echo "Set the health check path to /health on $APP_NAME (it was '${CURRENT:-not set}')."
          else
            echo "::warning::Could not set the health check path to /health on $APP_NAME."
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # The deploy restarts the app, so /health and /db-status are polled for up to three
      # minutes. The job fails unless /health answers 200 (Healthy or Degraded; 503 is
      # Unhealthy) and /db-status says "ok", twice in a row ten seconds apart: the first
      # good answer can still come from the instance being replaced. On failure the last
      # answers are printed; /health is anonymous, so its JSON is no more than anyone can
      # read there. The address is the one "Configure the API's public address" uses, or
      # else the Web App's default host name.
      - name: Smoke test (/health and /db-status)
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          API_ORIGIN: ${{ vars.API_BASE_URL || vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          API_ORIGIN="${API_ORIGIN%/}"
          case "$API_ORIGIN" in
            https://*) API_ORIGIN=$(printf '%s' "$API_ORIGIN" | sed -E 's#^(https://[^/]+).*#\1#') ;;
            *)
              RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
              HOST=""
              if [ -n "$RESOURCE_GROUP" ]; then
                HOST=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)
              fi
              if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
                echo "::error::No https address in API_BASE_URL or VITE_API_URL, and could not read the Web App's host name: nothing to smoke-test."
                exit 1
              fi
              API_ORIGIN="https://$HOST" ;;
          esac
          echo "Smoke-testing $API_ORIGIN/health and $API_ORIGIN/db-status ..."

          HEALTH="$RUNNER_TEMP/health.json"
          DB_STATUS="$RUNNER_TEMP/db-status.json"
          DEADLINE=$(( $(date +%s) + 180 ))
          PASSES=0
          ATTEMPT=0
          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            : >"$HEALTH"; : >"$DB_STATUS"
            HEALTH_CODE=$(curl -sS -o "$HEALTH" -w '%{http_code}' --max-time 20 "$API_ORIGIN/health" 2>/dev/null || true)
            DB_CODE=$(curl -sS -o "$DB_STATUS" -w '%{http_code}' --max-time 20 "$API_ORIGIN/db-status" 2>/dev/null || true)
            DB_STATE=$(jq -r '.status // empty' "$DB_STATUS" 2>/dev/null || true)
            if [ "$HEALTH_CODE" = "200" ] && [ "$DB_STATE" = "ok" ]; then
              PASSES=$((PASSES + 1))
              echo "Attempt $ATTEMPT: /health 200, /db-status ok ($PASSES of 2)."
              if [ "$PASSES" -ge 2 ]; then
                echo "Smoke test passed."
                exit 0
              fi
            else
              PASSES=0
              echo "Attempt $ATTEMPT: /health ${HEALTH_CODE:-000}, /db-status ${DB_CODE:-000} status '${DB_STATE:-none}'."
            fi
            [ "$(date +%s)" -lt "$DEADLINE" ] || break
            sleep 10
          done

          echo "::error::Smoke test failed: after 3 minutes /health answered ${HEALTH_CODE:-000} (200 needed; 000 is no answer) and /db-status said '${DB_STATE:-nothing}' (\"ok\" needed). Runbook: docs/MONITORING.md, Deploy smoke test failed."
          echo "Last /health response (HTTP ${HEALTH_CODE:-000}):"
          jq . "$HEALTH" 2>/dev/null || cat "$HEALTH"
          echo
          echo "Last /db-status response (HTTP ${DB_CODE:-000}):"
          jq . "$DB_STATUS" 2>/dev/null || cat "$DB_STATUS"
          echo
          exit 1
