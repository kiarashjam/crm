# Deploy backend (.NET Web API) to Azure Web App on every push to main (and on release / manual run)
name: Build and deploy backend to Azure Web App

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_PACKAGE_PATH: './publish-api'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore ACI.sln

      - name: Build
        working-directory: backend
        run: dotnet build ACI.sln --configuration Release --no-restore

      - name: Publish
        working-directory: backend
        run: dotnet publish src/ACI.WebApi/ACI.WebApi.csproj -c Release -o ${{ github.workspace }}/publish-api --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Applies the email (SendGrid) configuration so password reset, team
      # invitations and task reminders can send. Runs only when the SENDGRID_API_KEY
      # secret exists, so the deploy is unaffected until you add it.
      #
      # `appsettings set` MERGES: it updates only the keys named below and leaves
      # everything else (notably the database connection string) untouched.
      # The API key lives in GitHub Secrets and is never written to the repository.
      - name: Configure email settings (SendGrid)
        if: ${{ secrets.SENDGRID_API_KEY != '' }}
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # Origin of the deployed SPA — used to build the links inside the emails.
          # Override by adding a repository variable named SPA_BASE_URL.
          SPA_ORIGIN: ${{ vars.SPA_BASE_URL || 'https://mango-moss-0804bb403.1.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Could not find a Web App named '$APP_NAME' in this subscription; skipping email configuration."
            exit 1
          fi
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Email__SmtpPassword=$SENDGRID_API_KEY" "Email__FrontendBaseUrl=$SPA_ORIGIN" \
            --output none
          echo "Applied Email__SmtpPassword and Email__FrontendBaseUrl=$SPA_ORIGIN to $APP_NAME ($RESOURCE_GROUP)."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
