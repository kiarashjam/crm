# Deploy backend (.NET Web API) to Azure Web App.
#
# Called by deploy.yml on every push to main (and on release / manual run), after the
# checks in ci.yml have passed and before the frontend is deployed. It has no trigger
# of its own, so it cannot deploy anything that has not been checked: to deploy by
# hand, run "Build and deploy to Azure Static Web Apps", which checks, then deploys
# this, then the frontend.
name: Build and deploy backend to Azure Web App

on:
  workflow_call:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_PACKAGE_PATH: './publish-api'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore ACI.sln

      - name: Build
        working-directory: backend
        run: dotnet build ACI.sln --configuration Release --no-restore

      - name: Publish
        working-directory: backend
        run: dotnet publish src/ACI.WebApi/ACI.WebApi.csproj -c Release -o ${{ github.workspace }}/publish-api --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Applies the email (SendGrid) configuration so password reset, team
      # invitations and task reminders can send. No-ops until the SENDGRID_API_KEY
      # secret exists, so the deploy is unaffected before then.
      #
      # The "is the secret set?" test is done inside the script, NOT in an `if:`
      # condition: the secrets context is not available to step-level `if`, and
      # referencing it there makes the whole workflow file invalid (every job is
      # skipped, so the deploy fails before it starts).
      #
      # `appsettings set` MERGES: it updates only the keys named below and leaves
      # everything else (notably the database connection string) untouched.
      # The API key lives in GitHub Secrets and is never written to the repository.
      - name: Configure email settings (SendGrid)
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # Origin of the deployed SPA — used to build the links inside the emails.
          # Override by adding a repository variable named SPA_BASE_URL.
          SPA_ORIGIN: ${{ vars.SPA_BASE_URL || 'https://mango-moss-0804bb403.1.azurestaticapps.net' }}
        run: |
          set -euo pipefail
          if [ -z "${SENDGRID_API_KEY:-}" ]; then
            echo "SENDGRID_API_KEY secret is not set; leaving email settings unchanged."
            exit 0
          fi
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Could not find a Web App named '$APP_NAME' in this subscription; cannot apply email settings."
            exit 1
          fi
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Email__SmtpPassword=$SENDGRID_API_KEY" "Email__FrontendBaseUrl=$SPA_ORIGIN" \
            --output none
          echo "Applied Email__SmtpPassword and Email__FrontendBaseUrl=$SPA_ORIGIN to $APP_NAME ($RESOURCE_GROUP)."

      # The API's own public address (Email__ApiBaseUrl) builds the links to email images
      # and the address a member portal reports a welcome's progress to, which must be
      # https: Pavillon 46 refuses a handoff that names any other. It defaults to
      # localhost, so it is set here from the address the frontend is built to call
      # (VITE_API_URL), or API_BASE_URL when that is set. Only when the Web App has no
      # public address yet: one set by hand in Azure is kept.
      - name: Configure the API's public address
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          API_ORIGIN: ${{ vars.API_BASE_URL || vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          API_ORIGIN="${API_ORIGIN%/}"
          case "$API_ORIGIN" in
            https://*) ;;
            *) echo "Neither API_BASE_URL nor VITE_API_URL is an https address; leaving Email__ApiBaseUrl unchanged."; exit 0 ;;
          esac
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::warning::Could not find a Web App named '$APP_NAME'; leaving Email__ApiBaseUrl unchanged."
            exit 0
          fi
          CURRENT=$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='Email__ApiBaseUrl'].value | [0]" -o tsv)
          case "$CURRENT" in
            https://*localhost*|http://*|"") ;;
            https://*) echo "Email__ApiBaseUrl is already $CURRENT; keeping it."; exit 0 ;;
          esac
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "Email__ApiBaseUrl=$API_ORIGIN" \
            --output none
          echo "Set Email__ApiBaseUrl=$API_ORIGIN on $APP_NAME (it was '${CURRENT:-not set}')."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
