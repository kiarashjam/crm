# One-off org administration from CI, for when nobody with an Owner login is at
# a keyboard: ensure a person is a member of an organization with a given role.
#
# Runs entirely against the production database, through the same Azure service
# principal the deploy uses. Idempotent and rerunnable:
#
#   · account exists           → membership upserted with the requested role,
#                                any now-moot pending invites cleaned up
#   · no account yet           → a pending invite is (re)issued; the person sees
#                                it on the Organizations page when they sign up
#                                with that email. Accepting makes them a Member
#                                (that is hardcoded in the app), so RE-RUN this
#                                workflow afterwards to set the requested role.
#
# The connection string is read from the Web App's configuration at run time and
# masked; it never appears in logs.
#
# The repository is public, and so is this run's log. So the inputs are read from the
# event and masked rather than passed as step env (which the log prints), and the log
# says what was done and how many members there are: no email, no member list, and on
# a mistyped name not the names of the organizations there are.
#
# It never changes the owner's role (see sql/org-admin-member.sql), and it runs in the
# "production" environment, so a required reviewer can be added to it in Settings ->
# Environments; until then it runs without approval.

name: Org admin — ensure member

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email of the person'
        required: true
      organization:
        description: 'Organization name (space-insensitive match)'
        required: true
      role:
        description: 'Role to ensure'
        required: true
        default: 'Viewer'
        type: choice
        options: [Viewer, Member, Manager]

permissions:
  contents: read

concurrency:
  group: org-admin
  cancel-in-progress: false

jobs:
  ensure_member:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Ensure membership
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail

          # ---- the inputs, from the event rather than env, and masked in the log ----
          TARGET_EMAIL=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH")
          ORG_NAME=$(jq -r '.inputs.organization // ""' "$GITHUB_EVENT_PATH")
          TARGET_ROLE=$(jq -r '.inputs.role // ""' "$GITHUB_EVENT_PATH")
          # Before the masks: a mask covers one line, so the rest of a multi-line input
          # would be printed by its own ::add-mask:: line. A pattern, not grep, which
          # reads line by line and so never sees a newline.
          case "$TARGET_EMAIL$ORG_NAME" in
            *[[:cntrl:]]*) echo "::error::The inputs must be on one line."; exit 1 ;;
          esac
          [ -n "$TARGET_EMAIL" ] && echo "::add-mask::$TARGET_EMAIL"
          [ -n "$ORG_NAME" ] && echo "::add-mask::$ORG_NAME"
          if [ -z "$TARGET_EMAIL" ] || [ -z "$ORG_NAME" ]; then
            echo "::error::Both the email and the organization are required."; exit 1
          fi
          case "$TARGET_ROLE" in
            Viewer|Member|Manager) ;;
            *) echo "::error::The role must be Viewer, Member or Manager."; exit 1 ;;
          esac

          # ---- locate the app and its connection string (never printed) ----
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Web App '$APP_NAME' not found in this subscription."
            exit 1
          fi

          CONN=$(az webapp config connection-string list \
                   --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                   --query "[?name=='DefaultConnection'].value | [0]" -o tsv)
          if [ -z "$CONN" ] || [ "$CONN" = "None" ]; then
            CONN=$(az webapp config appsettings list \
                     --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                     --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)
          fi
          if [ -z "$CONN" ] || [ "$CONN" = "None" ]; then
            echo "::error::No DefaultConnection found on the Web App (checked connection strings and app settings)."
            echo "Connection string names present:"
            az webapp config connection-string list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv || true
            exit 1
          fi
          echo "::add-mask::$CONN"

          # ---- parse it into sqlcmd arguments, shell-quoted, still masked ----
          eval "$(CONN="$CONN" python3 - <<'PY'
          import os, shlex
          parts = dict()
          for piece in os.environ["CONN"].split(";"):
              if "=" in piece:
                  k, v = piece.split("=", 1)
                  parts[k.strip().lower()] = v.strip()
          server = parts.get("server") or parts.get("data source") or ""
          server = server.replace("tcp:", "").split(",")[0]
          db     = parts.get("initial catalog") or parts.get("database") or ""
          user   = parts.get("user id") or parts.get("uid") or parts.get("user") or ""
          pwd    = parts.get("password") or parts.get("pwd") or ""
          print(f"SQL_SERVER={shlex.quote(server)}")
          print(f"SQL_DB={shlex.quote(db)}")
          print(f"SQL_USER={shlex.quote(user)}")
          print(f"SQL_PASS={shlex.quote(pwd)}")
          PY
          )"
          echo "::add-mask::$SQL_PASS"
          echo "::add-mask::$SQL_USER"
          if [ -z "$SQL_SERVER" ] || [ -z "$SQL_DB" ]; then
            echo "::error::Could not parse server/database out of the connection string."
            exit 1
          fi

          # ---- open a pinhole in the SQL firewall for this runner (best effort;
          #      'Allow Azure services' often already covers GitHub's runners) ----
          FW_RULE="gh-run-${GITHUB_RUN_ID}"
          SQL_SERVER_NAME="${SQL_SERVER%%.*}"
          SQL_RG=$(az sql server list --query "[?name=='$SQL_SERVER_NAME'].resourceGroup | [0]" -o tsv 2>/dev/null || true)
          FW_CREATED=""
          cleanup() {
            if [ -n "$FW_CREATED" ]; then
              az sql server firewall-rule delete -g "$SQL_RG" -s "$SQL_SERVER_NAME" -n "$FW_RULE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if [ -n "$SQL_RG" ] && [ "$SQL_RG" != "None" ]; then
            RUNNER_IP=$(curl -fsS https://api.ipify.org || true)
            if [ -n "$RUNNER_IP" ]; then
              if az sql server firewall-rule create -g "$SQL_RG" -s "$SQL_SERVER_NAME" -n "$FW_RULE" \
                   --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null 2>&1; then
                FW_CREATED=1
                echo "Temporary firewall rule $FW_RULE created."
              fi
            fi
          fi

          # ---- sqlcmd (preinstalled on ubuntu-latest; install if missing) ----
          SQLCMD="$(command -v sqlcmd || true)"
          [ -z "$SQLCMD" ] && [ -x /opt/mssql-tools18/bin/sqlcmd ] && SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          if [ -z "$SQLCMD" ]; then
            curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb >/dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev >/dev/null
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          fi

          # ---- the task (sql/org-admin-member.sql), after the inputs as T-SQL literals ----
          literal() { printf "N'%s'" "${1//\'/\'\'}"; }
          {
            echo "DECLARE @Email nvarchar(256) = $(literal "$TARGET_EMAIL");"
            echo "DECLARE @OrgName nvarchar(256) = $(literal "$ORG_NAME");"
            echo "DECLARE @Role nvarchar(32) = $(literal "$TARGET_ROLE");"
            cat .github/workflows/sql/org-admin-member.sql
          } > "$RUNNER_TEMP/task.sql"

          # -x: the inputs are text, never sqlcmd variables.
          "$SQLCMD" -S "tcp:${SQL_SERVER},1433" -d "$SQL_DB" -U "$SQL_USER" -P "$SQL_PASS" -C -b -x -i "$RUNNER_TEMP/task.sql"
