# One-off org administration from CI: copy an organization into a new one.
#
# Copies every record the organization owns, everything that hangs off those records,
# and its members with their roles, into a new organization, under new ids. People are
# shared, not copied, so everyone in the original can use both. What is copied and what
# is deliberately not (the webhook key and outbound address, signing links, reminders and
# running sequences that would email someone twice) is in OrganizationCloner.cs.
#
# Runs against the production database through the same Azure service principal the
# deploy uses; the connection string is read at run time and masked.
#
#   · dry-run (the default): writes nothing. Counts what the copy would hold, table by
#     table, estimates its size, and fails if the database has less than twice that free.
#   · copy: the same check of the room first, then the copy is made inside a
#     transaction, checked, and committed only if the check passes.
#
# The dry run used to make the whole copy, attachment bytes included, in the production
# database every tenant shares and roll it back: a large organization could fill the
# database, failing everyone's writes, and its locks were held until the rollback.
#
# The check reads the copy back: each table must hold as many rows as the original (less
# what is left out on purpose), and nothing in the copy may point at a row of the
# original. Run twice, the second run refuses: the new name exists already.
#
# The repository is public, and so is this run's log. The names are read from the event
# and masked rather than passed as step env (which the log prints), and the log shows
# only the verdict and the sizes. The table-by-table report is tenant data: it never
# goes to the log, but is encrypted with the ADMIN_REPORT_PASSPHRASE secret and kept as
# the run's artifact for three days (an artifact of a public repository can be
# downloaded by anyone signed in to GitHub). To read it, download the artifact, unzip
# it and run
#
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in <file>.enc -out <file>
#
# which asks for the passphrase. It runs in the "production" environment, so a required
# reviewer can be added to it in Settings -> Environments; until then it runs without
# approval.

name: Org admin — copy organization

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Organization to copy (space-insensitive match)'
        required: true
      name:
        description: 'Name of the new organization'
        required: true
      mode:
        description: 'dry-run counts and checks the room, writing nothing; copy makes the copy and keeps it if it checks out'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, copy]

permissions:
  contents: read

concurrency:
  group: org-admin
  cancel-in-progress: false

jobs:
  copy_organization:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the copy tool
        run: dotnet build backend/tools/ACI.OrgClone -c Release

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Copy the organization
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          ADMIN_REPORT_PASSPHRASE: ${{ secrets.ADMIN_REPORT_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_REPORT_PASSPHRASE:-}" ]; then
            echo "::error::Set the ADMIN_REPORT_PASSPHRASE secret first: the report is encrypted with it, as the log is public."
            exit 1
          fi
          # ---- the inputs, from the event rather than env, and masked in the log ----
          SOURCE=$(jq -r '.inputs.source // ""' "$GITHUB_EVENT_PATH")
          COPY_NAME=$(jq -r '.inputs.name // ""' "$GITHUB_EVENT_PATH")
          MODE=$(jq -r '.inputs.mode // ""' "$GITHUB_EVENT_PATH")
          [ -n "$SOURCE" ] && echo "::add-mask::$SOURCE"
          [ -n "$COPY_NAME" ] && echo "::add-mask::$COPY_NAME"
          if [ -z "$SOURCE" ] || [ -z "$COPY_NAME" ]; then
            echo "::error::Both the organization to copy and the new name are required."; exit 1
          fi

          # ---- locate the app and its connection string (never printed) ----
          RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::Web App '$APP_NAME' not found in this subscription."
            exit 1
          fi

          CONN=$(az webapp config connection-string list \
                   --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                   --query "[?name=='DefaultConnection'].value | [0]" -o tsv)
          if [ -z "$CONN" ] || [ "$CONN" = "None" ]; then
            CONN=$(az webapp config appsettings list \
                     --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                     --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)
          fi
          if [ -z "$CONN" ] || [ "$CONN" = "None" ]; then
            echo "::error::No DefaultConnection found on the Web App (checked connection strings and app settings)."
            echo "Connection string names present:"
            az webapp config connection-string list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv || true
            exit 1
          fi
          echo "::add-mask::$CONN"

          # ---- the server name, for the firewall pinhole below; values stay masked ----
          eval "$(CONN="$CONN" python3 - <<'PY'
          import os, shlex
          parts = dict()
          for piece in os.environ["CONN"].split(";"):
              if "=" in piece:
                  k, v = piece.split("=", 1)
                  parts[k.strip().lower()] = v.strip()
          server = parts.get("server") or parts.get("data source") or ""
          server = server.replace("tcp:", "").split(",")[0]
          db     = parts.get("initial catalog") or parts.get("database") or ""
          user   = parts.get("user id") or parts.get("uid") or parts.get("user") or ""
          pwd    = parts.get("password") or parts.get("pwd") or ""
          print(f"SQL_SERVER={shlex.quote(server)}")
          print(f"SQL_DB={shlex.quote(db)}")
          print(f"SQL_USER={shlex.quote(user)}")
          print(f"SQL_PASS={shlex.quote(pwd)}")
          PY
          )"
          echo "::add-mask::$SQL_PASS"
          echo "::add-mask::$SQL_USER"
          if [ -z "$SQL_SERVER" ] || [ -z "$SQL_DB" ]; then
            echo "::error::Could not parse server/database out of the connection string."
            exit 1
          fi

          # ---- open a pinhole in the SQL firewall for this runner (best effort;
          #      'Allow Azure services' often already covers GitHub's runners) ----
          FW_RULE="gh-run-${GITHUB_RUN_ID}"
          SQL_SERVER_NAME="${SQL_SERVER%%.*}"
          SQL_RG=$(az sql server list --query "[?name=='$SQL_SERVER_NAME'].resourceGroup | [0]" -o tsv 2>/dev/null || true)
          FW_CREATED=""
          cleanup() {
            if [ -n "$FW_CREATED" ]; then
              az sql server firewall-rule delete -g "$SQL_RG" -s "$SQL_SERVER_NAME" -n "$FW_RULE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if [ -n "$SQL_RG" ] && [ "$SQL_RG" != "None" ]; then
            RUNNER_IP=$(curl -fsS https://api.ipify.org || true)
            if [ -n "$RUNNER_IP" ]; then
              if az sql server firewall-rule create -g "$SQL_RG" -s "$SQL_SERVER_NAME" -n "$FW_RULE" \
                   --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" >/dev/null 2>&1; then
                FW_CREATED=1
                echo "Temporary firewall rule $FW_RULE created."
              fi
            fi
          fi

          # ---- the copy ----
          COMMIT=""
          [ "$MODE" = "copy" ] && COMMIT="--commit"
          set +e
          ORG_CLONE_CONNECTION="$CONN" dotnet run --project backend/tools/ACI.OrgClone -c Release --no-build -- \
            --source "$SOURCE" --name "$COPY_NAME" $COMMIT --report "$RUNNER_TEMP/clone-report.txt"
          STATUS=$?
          set -e

          # ---- the table-by-table report: encrypted for the artifact, never printed ----
          if [ -f "$RUNNER_TEMP/clone-report.txt" ]; then
            mkdir -p "$RUNNER_TEMP/report"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ADMIN_REPORT_PASSPHRASE \
              -in "$RUNNER_TEMP/clone-report.txt" -out "$RUNNER_TEMP/report/org-clone-report.txt.enc"
            rm -f "$RUNNER_TEMP/clone-report.txt"
          fi
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

      - name: Keep the encrypted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-clone-report
          path: ${{ runner.temp }}/report/
          retention-days: 3
          if-no-files-found: ignore
