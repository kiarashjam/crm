# Deploy to production on every push to main (and on release / manual run).
#
# In order, each step only when the one before it passed:
#   1. checks   - ci.yml: backend build and tests, frontend typecheck, lint, tests, build
#   2. backend  - deploy-backend.yml, to the Azure Web App
#   3. frontend - this file's build_and_deploy, to Azure Static Web Apps
#
# Before, this and the backend deploy each ran on the push by themselves, with no
# test in front of either, and the frontend could go out before the API it calls.
name: Build and deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  # The launch offer (free until 31 December 2026, src/app/lib/launchOffer.ts) ends at
  # midnight in Zurich. The browser hides it by itself from then on; this rebuild, at
  # 00:07 in Zurich on 1 January, takes it out of the prerendered HTML crawlers read too.
  # It deploys main as it is, like a manual run.
  schedule:
    - cron: '7 23 31 12 *'

# One deploy at a time. A deploy under way is never cancelled halfway through; a
# newer push waits for it, and takes the place of any older one still waiting.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: checks
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  build_and_deploy:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm run build is vite build, then the prerender (scripts/seo/prerender.mjs): every
      # public page as static HTML, sitemap.xml, llms.txt, 404.html and the SWA routes. It
      # renders with React on Node, so no browser is installed; it adds a few seconds.
      - name: Build
        run: npm run build
        env:
          # Optional: set vars.VITE_API_URL (e.g. https://aci-api-xxx.azurewebsites.net) so frontend calls deployed backend
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Optional (docs/SEO.md): the search consoles' site-verification codes, and the
          # address "Request a demo" and "Contact us" write to. Empty leaves them out.
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.VITE_BING_SITE_VERIFICATION }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      # The sitemap the live site serves before this deploy, so IndexNow is told only
      # about pages that are new or changed. Nothing there yet is fine.
      - name: Keep the live sitemap
        run: curl -fsSL --max-time 20 https://www.cadencee.ai/sitemap.xml -o previous-sitemap.xml || true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          output_location: '.'
          skip_app_build: true

      # Bing and the other IndexNow engines hear about new and changed pages at once
      # (Google reads the sitemap). Never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/seo/indexnow.mjs --sitemap dist/sitemap.xml --previous previous-sitemap.xml
