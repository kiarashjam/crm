# Deploy to production on every push to main (and on release / manual run).
#
# In order, each step only when the one before it passed:
#   1. checks   - ci.yml: backend build and tests, frontend typecheck, lint, tests, build
#   2. backend  - deploy-backend.yml, to the Azure Web App
#   3. frontend - this file's build_and_deploy, to Azure Static Web Apps
#
# Before, this and the backend deploy each ran on the push by themselves, with no
# test in front of either, and the frontend could go out before the API it calls.
name: Build and deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# One deploy at a time. A deploy under way is never cancelled halfway through; a
# newer push waits for it, and takes the place of any older one still waiting.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: checks
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  build_and_deploy:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: set vars.VITE_API_URL (e.g. https://aci-api-xxx.azurewebsites.net) so frontend calls deployed backend
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          output_location: '.'
          skip_app_build: true
