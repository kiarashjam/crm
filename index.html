<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ea580c" />
    <!--
      Between these markers is the page's own head: title, description, canonical, robots,
      Open Graph, Twitter, hreflang and JSON-LD. The prerender (scripts/seo/prerender.mjs)
      writes each public page's head here, and the app keeps it in step on every route
      (src/app/marketing/SeoHead.tsx). The SPA shell it writes for the app's own pages
      (app.html) adds noindex.
    -->
    <!-- seo:head -->
    <title>CadenceE</title>
    <!-- /seo:head -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var name = (params.get('name') || '').trim();
        var section = (params.get('section') || '').trim();
        if (!name && !section) return;
        document.title = name && section
          ? name + ' » ' + section + ' » CadenceE'
          : (name || section) + ' » CadenceE';
      })();
    </script>
    <script>
      // The launch offer (src/app/lib/launchOffer.ts) ends on 1 January 2027, 00:00 in Zurich.
      // HTML prerendered before then still carries it: hide it before the first paint.
      if (Date.now() >= __LAUNCH_OFFER_ENDS_AT_MS__) document.documentElement.classList.add('launch-offer-ended');
    </script>
    <style>.launch-offer-ended [data-launch-offer]{display:none!important}</style>
  </head>
  <body>
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('crm_appearance_settings');
          if (stored) {
            var settings = JSON.parse(stored);
            var mode = settings.themeMode || settings.theme || 'system';
            var preset = settings.themePreset || 'default';
            var forceDarkPresets = ['midnight', 'nord', 'dracula'];
            var isDark = mode === 'dark' ||
              (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
              forceDarkPresets.includes(preset);
            if (isDark) {
              document.documentElement.classList.add('dark');
            }
            document.documentElement.setAttribute('data-theme', preset);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
